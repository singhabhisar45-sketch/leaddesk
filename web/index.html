<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LeadDesk Mini — Smart lead capture for modern businesses. Submit your project inquiry and connect with the right team.">
  <meta name="keywords" content="lead capture, project inquiry, digital services, LeadDesk">
  <meta property="og:title" content="LeadDesk Mini — Smart Lead Capture">
  <meta property="og:description" content="Turn visitors into real opportunities. Submit your project details and connect with the right team.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0D0D1A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LeadDesk Mini">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LeadDesk Mini — Smart Lead Capture</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background-color: #0D0D1A;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0D0D1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .loader-logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #6C63FF, #9C64FF);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 28px;
    }
    .loader-text {
      color: #6C63FF;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
    }
    .loader-bar {
      width: 160px;
      height: 3px;
      background: #1E1E32;
      border-radius: 3px;
      overflow: hidden;
    }
    .loader-bar-inner {
      height: 100%;
      background: linear-gradient(90deg, #6C63FF, #03DAC6);
      border-radius: 3px;
      animation: loading 1.5s ease-in-out infinite;
    }
    @keyframes loading {
      0% { width: 0%; margin-left: 0; }
      50% { width: 80%; margin-left: 0; }
      100% { width: 0%; margin-left: 100%; }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loader-logo">⚡</div>
    <div class="loader-text">LeadDesk Mini</div>
    <div class="loader-bar"><div class="loader-bar-inner"></div></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      const screen = document.getElementById('loading-screen');
      if (screen) {
        screen.style.opacity = '0';
        setTimeout(() => screen.remove(), 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
